name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  INSTALLERS: |
    src-tauri/target/release/bundle/msi/*.msi
    src-tauri/target/release/bundle/nsis/*-setup.exe

jobs:
  windows:
    name: build, test, package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build app and installers
        run: bun run tauri build

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ak820-companion-windows
          if-no-files-found: error
          path: ${{ env.INSTALLERS }}

      # Every push to master refreshes a rolling "latest" release, so the
      # installers are always one click away on the Releases page.
      - name: Publish rolling release (master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of `${{ github.sha }}` (run #${{ github.run_number }}).

            Download the installer below: `.msi` (Windows Installer) or the
            `-setup.exe` (NSIS). Both install the app and register it in the tray.
          files: ${{ env.INSTALLERS }}
          make_latest: true
          prerelease: false
          overwrite_files: true

      # Tagging v* publishes a versioned release instead.
      - name: Publish versioned release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLERS }}
          generate_release_notes: true
          draft: false
